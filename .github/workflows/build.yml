name: Build

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and Linux build
        run: |
          set -o pipefail
          ./gradlew --no-daemon test dist 2>&1 | tee build.log

      - name: Windows build from Linux
        run: |
          set -o pipefail
          ./gradlew --no-daemon dist -Ptarget=windows 2>&1 | tee -a build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E '^e: |FAILED|error:|Exception|expected:<|What went wrong' -A2 build.log | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Smoke test
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          echo "ARIA_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p smoke
          tar -xzf "build/dist/Aria-$version-linux-x64.tar.gz" -C smoke
          smoke/aria/bin/aria --self-test=smoke/report.txt || true
          cat smoke/report.txt
          grep -q status=ok smoke/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/dist/*-linux-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: windows-from-linux
          path: build/dist/*-windows-*.zip

  windows:
    runs-on: windows-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Windows build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew.bat --no-daemon dist 2>&1 | tee build.log

      - name: Linux build from Windows
        shell: bash
        run: |
          set -o pipefail
          ./gradlew.bat --no-daemon dist -Ptarget=linux 2>&1 | tee -a build.log

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |FAILED|error:|Exception|What went wrong' -A2 build.log | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/download-artifact@v4
        with:
          name: windows-from-linux
          path: cross

      - name: Smoke test
        shell: pwsh
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^version=(.*)').Matches[0].Groups[1].Value.Trim()
          "ARIA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Expand-Archive "build/dist/Aria-$version-windows-x64.zip" -DestinationPath smoke-native
          Expand-Archive "cross/Aria-$version-windows-x64.zip" -DestinationPath smoke-cross
          $failed = $false
          foreach ($dir in @("smoke-native", "smoke-cross")) {
            $report = Join-Path (Resolve-Path $dir) "report.txt"
            $p = Start-Process -FilePath "$dir/Aria/Aria.exe" -ArgumentList "--self-test=$report" -Wait -PassThru
            Write-Host "== $dir exit $($p.ExitCode)"
            if (Test-Path $report) { Get-Content $report } else { Write-Host "no report" }
            if (-not (Test-Path $report) -or -not (Select-String -Path $report -Pattern "status=ok" -Quiet)) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist/*-windows-*.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "ARIA_VERSION=$(sed -n 's/^version=//p' gradle.properties)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist

      - name: Remove screens branch
        continue-on-error: true
        run: git push origin --delete screens || true

      - name: Notes
        run: |
          : > notes.md
          [ -f CHANGELOG.md ] && awk -v v="$ARIA_VERSION" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md || true

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          tag_name: v${{ env.ARIA_VERSION }}
          name: Aria Desktop ${{ env.ARIA_VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*
